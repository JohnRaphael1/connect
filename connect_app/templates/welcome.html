{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect</title>
    <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a10;
            background-image:
                radial-gradient(circle at 30% 20%, rgba(230, 57, 70, 0.35) 0%, transparent 45%),
                radial-gradient(circle at 75% 80%, rgba(230, 57, 70, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, #1a0a10 0%, #0a0a10 70%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            position: relative;
        }

        /* Ambient moving glow behind everything */
        .glow {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(230, 57, 70, 0.4) 0%, transparent 65%);
            filter: blur(60px);
            animation: breathe 4s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        /* Logo — big, spinning, glowing */
        .logo-wrap {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: logoEntrance 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            z-index: 2;
        }
        .logo-wrap::before {
            content: '';
            position: absolute;
            inset: -20px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(230, 57, 70, 0.5) 0%, transparent 70%);
            animation: pulse 2.4s ease-in-out infinite;
        }
        .logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 30%;
            animation: spin 8s linear infinite;
            filter: drop-shadow(0 0 30px rgba(230, 57, 70, 0.6));
            position: relative;
            z-index: 2;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.3); opacity: 0.9; }
        }
        @keyframes logoEntrance {
            0% { opacity: 0; transform: scale(0.3) rotate(-180deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        /* Text */
        .brand {
            margin-top: 32px;
            font-size: 64px;
            font-weight: 900;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #fff 0%, #ffd0d6 50%, #e63946 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textFadeUp 1s ease 0.6s both;
            z-index: 2;
            position: relative;
        }
        .tagline {
            margin-top: 12px;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
            animation: textFadeUp 1s ease 0.9s both;
            z-index: 2;
            position: relative;
        }
        @keyframes textFadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Progress line at bottom */
        .progress-line {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
            z-index: 3;
        }
        .progress-line::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, #e63946, #ff8a94);
            box-shadow: 0 0 12px #e63946;
            animation: fillBar 10s linear forwards;
        }
        @keyframes fillBar {
            from { width: 0; }
            to { width: 100%; }
        }

        @media (max-width: 600px) {
            .logo-wrap { width: 130px; height: 130px; }
            .brand { font-size: 44px; }
            .tagline { font-size: 14px; letter-spacing: 3px; }
        }
    </style>
</head>
<body>

    <div class="glow"></div>

    <div class="logo-wrap">
        <img src="{% static 'images/logo.png' %}" alt="Connect">
    </div>
    <h1 class="brand">Connect</h1>
    <p class="tagline">Let's Connect</p>

    <div class="progress-line"></div>

    <script>
        // Redirect to login after 10 seconds
        setTimeout(() => {
            window.location.href = "{% url 'login' %}";
        }, 10000);
    </script>
</body>
</html>
