<!-- Mobile overlay -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<style>
    .sidebar {
        position: sticky;
        top: 90px;
        align-self: flex-start;
        width: 240px;
        padding: 16px 10px;
        border-radius: 20px;
        height: calc(100vh - 110px);
        overflow-y: auto;
    }
    .sidebar-nav { display: flex; flex-direction: column; gap: 4px; }

    .nav-item {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 14px;
        border-radius: 12px;
        color: var(--text);
        font-weight: 500;
        font-size: 15px;
        text-decoration: none;
        transition: background 0.2s, color 0.2s, transform 0.15s;
    }
    .nav-item:hover { background: var(--surface-strong); text-decoration: none; }
    .nav-item:active { transform: scale(0.98); }
    .nav-item.active {
        background: linear-gradient(135deg, rgba(230,57,70,0.18), rgba(255,77,90,0.12));
        color: var(--red);
        font-weight: 600;
    }
    .nav-item.active svg { color: var(--red); }

    .nav-item-danger:hover { background: rgba(217, 43, 58, 0.12); color: #d92b3a; }

    .nav-divider {
        height: 1px;
        background: var(--border-solid);
        margin: 8px 12px;
    }

    .sidebar-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(3px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s;
        z-index: 90;
    }
    .sidebar-overlay.open { opacity: 1; pointer-events: auto; }

    @media (max-width: 900px) {
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 280px;
            border-radius: 0 20px 20px 0;
            z-index: 100;
            transform: translateX(-105%);
            transition: transform 0.3s ease;
            padding-top: 80px;
        }
        .sidebar.open { transform: translateX(0); }
    }
</style>

<script>
    // Close sidebar on overlay click or Escape
    document.getElementById('sidebarOverlay')?.addEventListener('click', closeSidebar);
    function closeSidebar() {
        document.getElementById('sidebarDrawer')?.classList.remove('open');
        document.getElementById('sidebarOverlay')?.classList.remove('open');
    }
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeSidebar();
    });
</script>
