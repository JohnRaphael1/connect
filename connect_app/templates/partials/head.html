{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#e63946">
    <title>{% block title %}Connect{% endblock %}</title>

    <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">
    <link rel="apple-touch-icon" href="{% static 'images/logo.png' %}">

    <!-- Fonts (optional but gives that clean modern look) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ============================================================
           CONNECT — Design Tokens
           ============================================================ */
        :root {
            --red: #e63946;
            --red-light: #ff4d5a;
            --red-dark: #b02a37;
            --white: #ffffff;

            /* LIGHT MODE (default) */
            --bg: #f6f7fb;
            --bg-grad: radial-gradient(circle at 20% 20%, #ffe0e3 0%, #f6f7fb 45%),
                       radial-gradient(circle at 80% 80%, #ffd9dd 0%, #f6f7fb 50%);
            --surface: rgba(255, 255, 255, 0.55);
            --surface-strong: rgba(255, 255, 255, 0.8);
            --border-glass: rgba(255, 255, 255, 0.7);
            --border-solid: rgba(0, 0, 0, 0.06);
            --text: #1f1f29;
            --text-muted: #6b6b7b;
            --input-bg: rgba(255, 255, 255, 0.75);
            --input-border: rgba(0, 0, 0, 0.08);
            --shadow-glass: 0 8px 32px rgba(230, 57, 70, 0.08),
                            0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 12px 40px rgba(230, 57, 70, 0.18);
        }

        [data-theme="dark"] {
            --bg: #0e0e14;
            --bg-grad: radial-gradient(circle at 20% 20%, #3a0d13 0%, #0e0e14 45%),
                       radial-gradient(circle at 80% 80%, #2a0a0f 0%, #0e0e14 50%);
            --surface: rgba(25, 25, 35, 0.55);
            --surface-strong: rgba(30, 30, 42, 0.8);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-solid: rgba(255, 255, 255, 0.06);
            --text: #f2f2f7;
            --text-muted: #a0a0b0;
            --input-bg: rgba(0, 0, 0, 0.35);
            --input-border: rgba(255, 255, 255, 0.08);
            --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.4),
                            0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-hover: 0 12px 40px rgba(230, 57, 70, 0.35);
        }

        /* ============================================================
           RESET & BASE
           ============================================================ */
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            background-image: var(--bg-grad);
            background-attachment: fixed;
            color: var(--text);
            transition: background-color 0.3s, color 0.3s;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        a { color: var(--red); text-decoration: none; }
        a:hover { text-decoration: underline; }
        img { max-width: 100%; display: block; }
        button { font-family: inherit; cursor: pointer; }

        /* ============================================================
           GLASS COMPONENT
           ============================================================ */
        .glass {
            background: var(--surface);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            box-shadow: var(--shadow-glass);
            transition: box-shadow 0.25s, transform 0.25s, background 0.3s;
        }
        .glass-hover:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        /* ============================================================
           FORM ELEMENTS
           ============================================================ */
        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }
        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.3s;
        }
        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: var(--red);
            box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.15);
        }
        .form-textarea { resize: vertical; min-height: 90px; }

        /* ============================================================
           BUTTONS
           ============================================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            transition: transform 0.15s, box-shadow 0.2s, background 0.2s, opacity 0.2s;
            white-space: nowrap;
        }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.55; cursor: not-allowed; }

        .btn-primary {
            background: linear-gradient(135deg, var(--red) 0%, var(--red-light) 100%);
            color: #fff;
            box-shadow: 0 4px 14px rgba(230, 57, 70, 0.35);
        }
        .btn-primary:hover { box-shadow: 0 6px 22px rgba(230, 57, 70, 0.5); }

        .btn-ghost {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border-solid);
        }
        .btn-ghost:hover { background: var(--surface-strong); }

        .btn-danger {
            background: #d92b3a;
            color: #fff;
        }
        .btn-block { width: 100%; }

        /* ============================================================
           UTILITIES
           ============================================================ */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 16px;
        }
        .text-muted { color: var(--text-muted); }
        .text-center { text-align: center; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-8 { gap: 8px; }
        .gap-12 { gap: 12px; }
        .gap-16 { gap: 16px; }
        .mt-16 { margin-top: 16px; }
        .mb-16 { margin-bottom: 16px; }
        .hidden { display: none !important; }

        /* Logo */
        .logo {
            height: 40px;
            width: auto;
            border-radius: 10px;
            object-fit: contain;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(230, 57, 70, 0.35);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover { background: rgba(230, 57, 70, 0.6); }

        /* Toast / alert */
        .alert {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 14px;
            font-weight: 500;
        }
        .alert-error { background: rgba(217, 43, 58, 0.12); color: #d92b3a; border: 1px solid rgba(217, 43, 58, 0.3); }
        .alert-success { background: rgba(34, 197, 94, 0.12); color: #16a34a; border: 1px solid rgba(34, 197, 94, 0.3); }
        .alert-info { background: rgba(59, 130, 246, 0.12); color: #2563eb; border: 1px solid rgba(59, 130, 246, 0.3); }

        /* Spinner */
        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Fade-in animation */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeInUp 0.35s ease both; }
    </style>

    {% block extra_css %}{% endblock %}
</head>
