{% load static %}
<header class="navbar glass">
    <div class="navbar-inner">

        <!-- LEFT: Logo + mobile menu button -->
        <div class="navbar-left">
            <button class="icon-btn mobile-only" id="openSidebar" aria-label="Menu">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>
            <a href="/" class="logo-link">
                <img src="{% static 'images/logo.png' %}" alt="Connect" class="logo">
            </a>
        </div>

        <!-- CENTER: Search -->
        <div class="navbar-center">
            <form class="search-form" action="{% url 'search' %}" method="get">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" name="q" placeholder="Search people..." class="search-input" autocomplete="off">
            </form>
        </div>

        <!-- RIGHT: Notifications, messages, theme, avatar -->
        <div class="navbar-right">
            <a href="{% url 'notifications' %}" class="icon-btn" aria-label="Notifications" title="Notifications">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <span class="notif-badge hidden" id="notifBadge"></span>
            </a>

            <a href="{% url 'messages' %}" class="icon-btn" aria-label="Messages" title="Messages">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
            </a>

            <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
                <svg id="iconSun" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"/>
                    <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                    <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
                <svg id="iconMoon" class="hidden" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>

            <a href="{% url 'profile' request.user.username %}" class="avatar-link" title="Profile">
                {% if request.user.profile_pic %}
                    <img src="{{ request.user.profile_pic.url }}" alt="{{ request.user.username }}" class="avatar">
                {% else %}
                    <div class="avatar avatar-fallback">{{ request.user.username|first|upper }}</div>
                {% endif %}
            </a>
        </div>
    </div>
</header>

<style>
    .navbar {
        position: sticky;
        top: 0;
        z-index: 100;
        border-radius: 0 0 20px 20px;
        margin-bottom: 20px;
        padding: 10px 0;
    }
    .navbar-inner {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 16px;
        display: flex;
        align-items: center;
        gap: 16px;
    }
    .navbar-left { display: flex; align-items: center; gap: 10px; }
    .navbar-center { flex: 1; max-width: 460px; margin: 0 auto; }
    .navbar-right { display: flex; align-items: center; gap: 6px; }

    .logo-link { display: flex; align-items: center; }

    .search-form {
        position: relative;
        display: flex;
        align-items: center;
    }
    .search-icon {
        position: absolute;
        left: 14px;
        color: var(--text-muted);
        pointer-events: none;
    }
    .search-input {
        width: 100%;
        padding: 10px 14px 10px 42px;
        border-radius: 999px;
        border: 1px solid var(--border-solid);
        background: var(--input-bg);
        color: var(--text);
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input:focus {
        border-color: var(--red);
        box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.15);
    }

    .icon-btn {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: none;
        background: transparent;
        color: var(--text);
        transition: background 0.2s, transform 0.15s;
    }
    .icon-btn:hover { background: var(--surface-strong); }
    .icon-btn:active { transform: scale(0.92); }

    .notif-badge {
        position: absolute;
        top: 8px;
        right: 8px;
        min-width: 8px;
        height: 8px;
        background: var(--red);
        border-radius: 50%;
        border: 2px solid var(--bg);
    }

    .avatar-link { margin-left: 4px; }
    .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--red);
    }
    .avatar-fallback {
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, var(--red), var(--red-light));
        color: #fff;
        font-weight: 700;
        font-size: 16px;
    }

    .mobile-only { display: none; }

    @media (max-width: 768px) {
        .mobile-only { display: flex; }
        .navbar-center { display: none; }
        .navbar { border-radius: 0; }
    }
</style>

<script>
    // Toggle theme — persists in localStorage, and syncs icons
    (function () {
        const root = document.documentElement;
        const btn = document.getElementById('themeToggle');
        const sun = document.getElementById('iconSun');
        const moon = document.getElementById('iconMoon');

        function apply(theme) {
            root.setAttribute('data-theme', theme);
            if (theme === 'dark') {
                sun.classList.add('hidden');
                moon.classList.remove('hidden');
            } else {
                sun.classList.remove('hidden');
                moon.classList.add('hidden');
            }
        }

        // Load saved theme (default = light)
        apply(localStorage.getItem('connect-theme') || 'light');

        btn.addEventListener('click', () => {
            const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            apply(next);
            localStorage.setItem('connect-theme', next);
        });
    })();

    // Mobile sidebar open (sidebar partial defines the drawer)
    document.getElementById('openSidebar')?.addEventListener('click', () => {
        document.getElementById('sidebarDrawer')?.classList.add('open');
        document.getElementById('sidebarOverlay')?.classList.add('open');
    });
</script>
